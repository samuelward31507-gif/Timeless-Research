# Netlify reads this at deploy time. The site is regenerated on every deploy so
# that TR_SITE and the other build settings below actually take effect, then
# assembled into dist/ so the repository's own tooling is not served.
[build]
  command = "python3 tools/build.py && python3 tools/dist.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"
  # Canonical URLs, Open Graph URLs and the sitemap are built from this.
  # Change it to the live domain once one is attached.
  TR_SITE = "https://www.timelessresearch.com"
  TR_CONTACT_EMAIL = "accounts@timelessresearch.com"
  # Account applications are captured by Netlify Forms; no endpoint required.
  TR_FORM_PROVIDER = "netlify"
  # Identity used in the legal documents. These must be your real trading
  # details. The build renders anything missing as a visible marker in the page
  # and tools/check.py fails while one is present, so filling these in is not
  # optional. TR_LEGAL_ENTITY defaults to the brand name and TR_LEGAL_EMAIL to
  # TR_CONTACT_EMAIL, so only the two below normally need setting.
  TR_LEGAL_ADDRESS = ""
  TR_LEGAL_STATE = ""
  # Set to "1" to deploy a demonstration copy: every page carries a bar saying
  # the site is not trading, search engines are asked to stay away, and the
  # unfilled legal fields above become a warning instead of a build failure.
  # Remove it, or set it to "0", for the real thing.
  TR_DEMO = "1"

# Hashed filenames are not used, so pages must revalidate while the static
# assets they reference can be cached hard.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
