<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business overview &middot; Operations &middot; Timeless Research</title>
<meta name="description" content="The Timeless Research operations console. Private: for staff only.">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FAF9F7">
<link rel="icon" href="../assets/img/favicon.svg?v=67cddb16" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/fonts.css?v=c5c0eaef">
<link rel="stylesheet" href="../assets/css/main.css?v=e8ecebd6">
<link rel="stylesheet" href="../assets/css/console.css?v=b5e3903f">
<script src="../assets/js/console/auth.js?v=50cd5132" defer></script>
<script src="../assets/js/console/api.js?v=1ae022a2" defer></script>
<script src="../assets/js/console/ui.js?v=61e199d1" defer></script>
<script src="../assets/js/console/shell.js?v=f6e8dc3d" defer></script>
<script src="../assets/js/console/format.js?v=bf3ca1c6" defer></script>
<script src="../assets/js/console/page.js?v=68820bc1" defer></script>
<script src="../assets/js/console/command.js?v=cd2aad90" defer></script>
</head>
<body class="console" data-console-page="command">
<a class="skip-link" href="#main">Skip to content</a>
<header class="console-header">
  <a class="console-brand" href="index.html">Timeless Research <span class="console-brand-sub">Operations</span></a>
  <p class="console-session" id="console-session" aria-live="polite">Not signed in</p>
  <button type="button" class="console-menu-btn" id="console-menu-btn" aria-controls="console-nav" aria-expanded="false">Menu</button>
</header>
<div class="console-alert" id="console-alert" role="alert" hidden></div>
<div class="console-layout">
  <nav class="console-nav" id="console-nav" aria-label="Console">
    <ul class="console-nav-list">
    <li><a class="console-nav-link" href="index.html" aria-current="page">Business overview</a></li>
    </ul>
  </nav>
  <main class="console-main console-main--wide" id="main" tabindex="-1">
    <div class="cc-head">
      <h1 class="console-title">Business overview</h1>
      <div class="cc-head-meta">
        <p class="cc-updated" id="cc-updated" aria-live="polite"></p>
        <button type="button" class="btn btn--ghost btn--sm" id="cc-refresh" hidden>Refresh</button>
      </div>
    </div>
    <div class="console-view cc-notice" id="cc-notice" data-state="loading" aria-busy="true">
      <p class="console-state-text">Loading&hellip;</p>
    </div>
    <div class="cc-workspace" id="cc-workspace" hidden>
      <section class="cc-snapshot" id="cc-snapshot" aria-labelledby="cc-snapshot-title">
        <h2 class="sr-only" id="cc-snapshot-title">At a glance</h2>
        <div class="cc-snapshot-groups" id="cc-snapshot-body"></div>
      </section>
      <section class="cc-section cc-section--stages" id="cc-stages" aria-labelledby="cc-stages-title">
        <div class="cc-section-head">
          <h2 class="cc-section-title" id="cc-stages-title">Order stages</h2>
        </div>
        <div class="console-view cc-body" id="cc-stages-body"></div>
      </section>
      <div class="cc-row">
      <section class="cc-section cc-section--attention" id="cc-attention" aria-labelledby="cc-attention-title">
        <div class="cc-section-head">
          <h2 class="cc-section-title" id="cc-attention-title">Needs attention</h2>
        </div>
        <div class="console-view cc-body" id="cc-attention-body"></div>
      </section>
      <section class="cc-section cc-section--recent" id="cc-recent" aria-labelledby="cc-recent-title">
        <div class="cc-section-head">
          <h2 class="cc-section-title" id="cc-recent-title">Recent orders</h2>
        </div>
        <div class="console-view cc-body" id="cc-recent-body"></div>
      </section>
        <div class="cc-stack">
      <section class="cc-section" id="cc-activity" aria-labelledby="cc-activity-title">
        <div class="cc-section-head">
          <h2 class="cc-section-title" id="cc-activity-title">Recent activity</h2>
        </div>
        <div class="console-view cc-body" id="cc-activity-body"></div>
      </section>
      <section class="cc-section" id="cc-stock" aria-labelledby="cc-stock-title">
        <div class="cc-section-head">
          <h2 class="cc-section-title" id="cc-stock-title">Low stock</h2>
        </div>
        <div class="console-view cc-body" id="cc-stock-body"></div>
      </section>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="console-toast" id="console-toast" role="status" aria-live="polite" hidden></div>
<dialog class="console-dialog" id="console-confirm" aria-labelledby="console-confirm-title" aria-describedby="console-confirm-body">
  <form method="dialog" class="console-dialog-form" id="console-confirm-form">
    <h2 class="console-dialog-title" id="console-confirm-title">Confirm</h2>
    <p class="console-dialog-body" id="console-confirm-body"></p>
    <div class="console-dialog-reason" id="console-confirm-reason-wrap" hidden>
      <label for="console-confirm-reason" id="console-confirm-reason-label">Reason</label>
      <textarea id="console-confirm-reason" rows="3" maxlength="1000"></textarea>
    </div>
    <div class="console-dialog-actions">
      <button type="button" class="btn btn--ghost btn--sm" id="console-confirm-cancel">Cancel</button>
      <button type="submit" class="btn btn--primary btn--sm" id="console-confirm-ok" value="confirm">Confirm</button>
    </div>
  </form>
</dialog>
</body>
</html>
